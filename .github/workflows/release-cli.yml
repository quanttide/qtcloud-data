name: release

on:
  push:
    tags:
      - "cli/v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean checkout
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::release checkout is not clean"
            git status --short
            exit 1
          fi

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::tag $GITHUB_REF_NAME does not point to a commit merged into main"
            exit 1
          fi

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli/v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG release notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli/v}"
          if ! awk -v version="$TAG_VERSION" '
            BEGIN { header = "## [" version "]" }
            index($0, header) == 1 {
              suffix = substr($0, length(header) + 1, 1)
              if (suffix == "" || suffix == " " || suffix == "-") {
                capture = 1
                found = 1
                next
              }
            }
            capture && /^## \[/ { exit }
            capture { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md missing ## [$TAG_VERSION] entry"
            exit 1
          fi
          if ! grep -Eq '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md entry for $TAG_VERSION has no release notes"
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: true

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -A warnings

      - name: Format
        run: cargo fmt --check

      - name: Package dry run
        run: cargo publish --locked --dry-run --registry crates-io

  publish-crate:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish qtcloud-data-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CRATES_API_TOKEN repository secret is not configured"
            exit 1
          fi
          cargo publish --locked --registry crates-io

  build-binary:
    needs:
      - check
      - publish-crate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            archive_name: qtcloud-data-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            archive_name: qtcloud-data-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Extract release notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli/v}"
          awk -v version="$TAG_VERSION" '
            BEGIN { header = "## [" version "]" }
            index($0, header) == 1 {
              suffix = substr($0, length(header) + 1, 1)
              if (suffix == "" || suffix == " " || suffix == "-") {
                capture = 1
                next
              }
            }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -Eq '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md entry for $TAG_VERSION has no release notes"
            exit 1
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar czf ../../../qtcloud-data-${{ matrix.target }}.tar.gz qtcloud-data
          else
            7z a ../../../qtcloud-data-${{ matrix.target }}.zip qtcloud-data.exe
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: src/cli/release-notes.md
          files: src/cli/${{ matrix.archive_name }}
          fail_on_unmatched_files: true
